<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브라우저 안 SQL</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 1.5rem auto; padding: 0 1rem; line-height: 1.5; }
  textarea { width: 100%; height: 11rem; font-family: ui-monospace, Consolas, monospace; font-size: 0.9rem; box-sizing: border-box; }
  button { margin: 0.2rem 0.3rem 0.2rem 0; }
  table { border-collapse: collapse; font-size: 0.85rem; margin-top: 0.5rem; }
  th, td { border: 1px solid #ccc; padding: 0.2rem 0.5rem; text-align: left; white-space: nowrap; }
  th { background: #f2f2f2; position: sticky; top: 0; }
  #result { overflow: auto; max-height: 70vh; }
  #error { color: #b00020; white-space: pre-wrap; }
  .note { color: #555; font-size: 0.9rem; }
  details { margin: 0.2rem 0; }
  code { font-size: 0.85rem; }
</style>
</head>
<body>
<p><a href="index.html">카탈로그로 돌아가기</a></p>
<h1>브라우저 안 SQL (DuckDB-WASM)</h1>
<p class="note">데이터는 이 브라우저가 이 사이트의 Parquet 파일을 직접 읽습니다(HTTP 범위 요청으로 필요한 부분만). 입력한 SQL과 결과는 어떤 서버로도 보내지 않습니다. DuckDB-WASM 엔진만 jsDelivr CDN에서 받아옵니다.</p>
<p id="status">불러오는 중...</p>
<div id="views"></div>

<h2>질의</h2>
<div id="examples"></div>
<textarea id="sql" spellcheck="false">SELECT * FROM dong_profile LIMIT 10;</textarea>
<div><button id="run" disabled>실행</button> <span id="meta"></span></div>
<div id="error"></div>
<div id="result"></div>

<script type="module">
import * as duckdb from 'https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.33.1-dev57.0/+esm';

const $ = (id) => document.getElementById(id);
const MAX_ROWS = 500;

const EXAMPLES = [
  ['구별 오피스텔 월세 중앙값', `SELECT p.sgg_cd,
       quantile_cont(r.monthly_rent_10k_won, 0.5) AS median_monthly_rent_10k_won,
       count(*) AS deals
FROM rent_listing r
JOIN dong_profile p ON p.dong_id = r.dong_id
WHERE r.source_type = 'offi'
  AND r.lease_type = '월세'
  AND r.monthly_rent_10k_won > 0
GROUP BY p.sgg_cd
ORDER BY median_monthly_rent_10k_won DESC;`],
  ['역삼1동이 직장일 때 출근 시간 짧은 출발 동 10개', `SELECT o.dong_nm AS origin_dong_nm,
       c.avg_minutes,
       c.basis,
       c.distance_km
FROM commute_od c
JOIN dong_profile o ON o.dong_id = c.origin_dong_id
WHERE c.dest_dong_id = (SELECT dong_id FROM dong_profile WHERE dong_nm = '역삼1동')
ORDER BY c.avg_minutes
LIMIT 10;`],
  ['표별 행 수', `SELECT 'dong_profile' AS view_name, count(*) AS rows FROM dong_profile
UNION ALL SELECT 'commute_od', count(*) FROM commute_od
UNION ALL SELECT 'rent_listing', count(*) FROM rent_listing
UNION ALL SELECT 'dong_mois_map', count(*) FROM dong_mois_map;`],
];

function showError(e) {
  $('error').textContent = '오류: ' + (e && e.message ? e.message : String(e));
  console.error(e);
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${url} 응답 ${res.status}`);
  return res.json();
}

function fmt(v, type) {
  if (v === null || v === undefined) return 'NULL';
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  if (typeof v === 'number' && type.startsWith('Date')) return new Date(v).toISOString().slice(0, 10);
  if (typeof v === 'number' && type.startsWith('Timestamp')) return new Date(v).toISOString();
  return String(v);
}

function render(table) {
  const fields = table.schema.fields;
  const types = fields.map((f) => String(f.type));
  const head = '<tr>' + fields.map((f) => `<th>${esc(f.name)}</th>`).join('') + '</tr>';
  const rows = [];
  const n = Math.min(table.numRows, MAX_ROWS);
  for (let i = 0; i < n; i++) {
    const row = table.get(i);
    rows.push('<tr>' + fields.map((f, j) => `<td>${esc(fmt(row[f.name], types[j]))}</td>`).join('') + '</tr>');
  }
  $('result').innerHTML = `<table>${head}${rows.join('')}</table>`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

let conn;

async function run() {
  $('error').textContent = '';
  $('meta').textContent = '실행 중...';
  $('run').disabled = true;
  const t0 = performance.now();
  try {
    const table = await conn.query($('sql').value);
    const ms = Math.round(performance.now() - t0);
    render(table);
    const shown = table.numRows > MAX_ROWS ? ` (앞 ${MAX_ROWS}행만 표시)` : '';
    $('meta').textContent = `${table.numRows}행, ${ms} ms${shown}`;
  } catch (e) {
    $('meta').textContent = '';
    $('result').innerHTML = '';
    showError(e);
  } finally {
    $('run').disabled = false;
  }
}

async function init() {
  const bundle = await duckdb.selectBundle(duckdb.getJsDelivrBundles());
  const workerUrl = URL.createObjectURL(
    new Blob([`importScripts("${bundle.mainWorker}");`], { type: 'text/javascript' }));
  const worker = new Worker(workerUrl);
  const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING), worker);
  await db.instantiate(bundle.mainModule, bundle.pthreadWorker);
  URL.revokeObjectURL(workerUrl);
  await db.open({ query: { castDecimalToDouble: true } });
  conn = await db.connect();

  const latestUrl = new URL('latest.json', location.href);
  const latest = await fetchJson(latestUrl);
  const manifestUrl = new URL(latest.manifest, latestUrl);
  const manifest = await fetchJson(manifestUrl);

  const lines = [];
  for (const [name, cols] of Object.entries(manifest.schema)) {
    const fileUrl = new URL(`${name}.parquet`, manifestUrl).href;
    await conn.query(`CREATE VIEW "${name.replaceAll('"', '""')}" AS SELECT * FROM read_parquet('${fileUrl.replaceAll("'", "''")}')`);
    const colText = cols.map(([c, t]) => `${esc(c)} <small>${esc(t)}</small>`).join(', ');
    lines.push(`<details><summary><code>${esc(name)}</code> (${cols.length}개 컬럼)</summary><p>${colText}</p></details>`);
  }
  $('views').innerHTML = '<h2>뷰</h2>' + lines.join('');
  $('status').textContent = `버전 ${manifest.version} (DuckDB-WASM ${duckdb.PACKAGE_VERSION}) 준비됨`;
  $('run').disabled = false;
}

for (const [label, sql] of EXAMPLES) {
  const b = document.createElement('button');
  b.textContent = label;
  b.addEventListener('click', () => { $('sql').value = sql; if (conn) run(); });
  $('examples').appendChild(b);
}
$('run').addEventListener('click', run);
$('sql').addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && conn) run();
});

init().catch((e) => { $('status').textContent = '불러오기 실패'; showError(e); });
</script>
</body>
</html>
